s.\u003c/p>\u003cp>A Separate Certification Pathway\u003c/p>\u003cp>The Type Approval framework in Yemen is currently administered through separate authorities based in Sana’a and Aden.\u003c/p>\u003cp>The Aden-based Ministry of Telecommunications and Information Technology provides services for telecommunications equipment, including import permits and Type Approval applications.\u003c/p>\u003cp>The Ministry’s electronic services platform identifies Type Approval and import authorization services for telecommunications equipment and provides information for companies seeking regulatory approval.\u003c/p>\u003cp>Products That May Be Affected\u003c/p>\u003cp>The regulatory process may apply to a broad range of telecommunications and wireless products, including:\u003c/p>\u003cp>Wireless communication equipment\u003c/p>\u003cp>RF equipment\u003c/p>\u003cp>Wi-Fi and Bluetooth devices\u003c/p>\u003cp>Cellular and mobile equipment\u003c/p>\u003cp>IoT devices\u003c/p>\u003cp>Networking equipment\u003c/p>\u003cp>Satellite communication equipment\u003c/p>\u003cp>Radio communication equipment\u003c/p>\u003cp>Other telecommunications and ICT equipment subject to applicable requirements\u003c/p>\u003cp>What Manufacturers Need to Know\u003c/p>\u003cp>Manufacturers and exporters planning to supply products to Aden-administered areas should determine the applicable regulatory pathway before shipment.\u003c/p>\u003cp>The destination and distribution plan should be established at the beginning of the compliance process, as Type Approval issued through the Sana’a and Aden authorities should not be assumed to be mutually recognized.\u003c/p>\u003cp>Applicants should prepare the technical documentation required for the applicable authority, including product specifications, technical catalogues, manufacturer's Declaration of Conformity, relevant test reports and other supporting documents.\u003c/p>\u003cp>Market Access Considerations\u003c/p>\u003cp>The development of a separate Aden Type Approval pathway is particularly relevant to international manufacturers whose products enter Yemen through southern ports or are intended for distribution in Aden-administered areas.\u003c/p>\u003cp>Companies with products intended for multiple regions of Yemen should assess the regulatory requirements for each destination before shipment.\u003c/p>\u003cp>Manufacturers should also consider the applicable customs and import procedures and coordinate their documentation with the local importer or representative.\u003c/p>\u003cp>Preparing for Type Approval\u003c/p>\u003cp>Before submitting an application, manufacturers should ensure that the product model, technical specifications, test reports and conformity documentation are consistent.\u003c/p>\u003cp>A complete technical file can help reduce additional information requests during regulatory review and facilitate the market-entry process.\u003c/p>\u003cp>AFAQ JOOD Regulatory Support\u003c/p>\u003cp>AFAQ JOOD supports international manufacturers, exporters and technology companies with Type Approval and regulatory compliance coordination across selected markets in the Middle East and Africa.\u003c/p>\u003cp>For products intended for Yemen, our team can assist manufacturers in identifying the applicable regulatory pathway, preparing technical documentation and coordinating the approval process with relevant local stakeholders.\u003c/p>\u003cp>Manufacturers planning to supply telecommunications, wireless, RF or ICT equipment to Aden-administered areas should assess the applicable Type Approval requirements before shipment.\u003c/p>\u003cp>Regulatory requirements may vary according to the product category, technology and destination. Manufacturers should verify the applicable requirements for their specific equipment before entering the Yemeni market.\u003cbr>\u003c/p>"},"whatKnow":{"en":"\u003cp>Manufacturers and exporters planning to supply telecommunications equipment to Aden-controlled areas should assess the
