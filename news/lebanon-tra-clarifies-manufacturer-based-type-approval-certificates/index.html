<script>window.__AFAQ_STATIC_ARTICLE={"id":"news-1789567002608","slug":"lebanon-tra-clarifies-manufacturer-based-type-approval-certificates","status":"published","country":"Lebanon","countryCode":"LB","countryKey":"LB__lebanon__8","countrySlug":"lebanon","countryName":{"en":"Lebanon"},"authority":"TRA","category":"Regulatory Update","date":"2026-09-16","publishedAt":"2026-09-16T14:09:55.510Z","updatedAt":"2026-09-16T14:09:55.510Z","author":"AFAQ JOOD Regulatory Intelligence Team","impact":"high","featured":true,"products":["Telecommunications equipment Radio and wireless equipment RF equipment Wi-Fi and Bluetooth devices Cellular and mobile equipment IoT and connected devices Telecommunications modules Embedded telecom-enabled equipment Radio components Telecommunications terminal equipment Other products subject to Lebanon Type Approval requirements"],"tags":["Lebanon Type Approval","Lebanon TRA","Lebanon telecommunications regulations","Lebanon Type Approval requirements","Lebanon RF approval","Lebanon wireless approval","Lebanon telecom equipment approval","Lebanon regulatory compliance","Lebanon market access","TRA Lebanon","Type Approval Certificate","manufacturer Type Approval","telecom equipment Lebanon","wireless equipment Lebanon","RF equipment Lebanon","IoT Lebanon"],"title":{"en":"Lebanon TRA Clarifies Manufacturer-Based Type Approval Certificates"},"summary":{"en":"Lebanon’s Telecommunications Regulatory Authority (TRA) has issued a clarification on the Type Approval procedure for telecom-enabled equipment, addressing the relationship between manufacturers, approved models, and importers."},"body":{"en":"\u003cp>Lebanon TRA Clarifies Manufacturer-Based Type Approval Certificates\u003c/p>\u003cp>Lebanon’s Telecommunications Regulatory Authority (TRA) has issued a clarification concerning the Type Approval procedure for equipment with telecommunications capabilities.\u003c/p>\u003cp>On September 2, 2026, the TRA issued Notification No. TRA/PRE/327-020926, addressing the relationship between Type Approval applications, manufacturers, approved models, and the importation of identical products into Lebanon.\u003c/p>\u003cp>According to the notification, as reported by specialist regulatory compliance sources, a Type Approval application may be submitted in the name of the manufacturer, either directly by the manufacturer or through an authorized representative.\u003c/p>\u003cp>The corresponding Type Approval Certificate is issued in the manufacturer’s name for the specific approved model or product. The notification states that importers bringing the identical approved product into Lebanon may rely on the manufacturer-based Type Approval, provided that the imported equipment corresponds to the approved model and technical specifications covered by the valid certificate.\u003c/p>\u003cp>What Manufacturers Need to Know\u003c/p>\u003cp>Manufacturers supplying telecommunications and radio-enabled products to Lebanon should ensure that the product model, technical specifications, telecommunications functions, and supporting documentation submitted for Type Approval accurately correspond to the products intended for importation.\u003c/p>\u003cp>The clarification is particularly relevant to international manufacturers whose products may be supplied to the Lebanese market through multiple importers or distributors.\u003c/p>\u003cp>Manufacturers may submit applications directly or through an authorized representative, depending on the applicable procedure and representation arrangements.\u003c/p>\u003cp>Affected Products\u003c/p>\u003cp>The clarification is relevant to telecommunications-enabled products, including:\u003c/p>\u003cp>Telecommunications equipment\u003c/p>\u003cp>Radio and wireless equipment\u003c/p>\u003cp>RF equipment\u003c/p>\u003cp>Wi-Fi and Bluetooth devices\u003c/p>\u003cp>Cellular and mobile equipment\u003c/p>\u003cp>IoT and connected devices\u003c/p>\u003cp>Telecommunications modules\u003c/p>\u003cp>Embedded telecommunications equipment\u003c/p>\u003cp>Radio components\u003c/p>\u003cp>Telecommunications terminal equipment\u003c/p>\u003cp>Other products subject to Lebanon Type Approval requirements\u003c/p>\u003cp>Technical Compliance\u003c/p>\u003cp>The TRA Type Approval framework requires applicants to provide appropriate technical documentation and evidence of compliance.\u003c/p>\u003cp>Depending on the equipment, the Technical Compliance Folder may include technical data sheets, user manuals, product specifications, drawings and schematics, antenna information for wireless equipment, product photographs, applicable technical standards, and third-party test reports.\u003c/p>\u003cp>The TRA states that recognized laboratory test results should come from laboratories accredited according to ISO/IEC 17025 through an appropriate accreditation body or an ILAC member.\u003c/p>\u003cp>Applicants are also required to prepare a Declaration of Conformity with the applicable specifications.\u003c/p>\u003cp>Regulatory Framework\u003c/p>\u003cp>The issuance of Type Approval certificates is currently handled by Lebanon’s Telecommunications Regulatory Authority (TRA). The TRA also maintains the current Type Approval Regulation, application procedures, forms, and technical requirements on its official website.\u003c/p>\u003cp>The TRA’s current regulatory framework was updated following the transfer of Type Approval certification responsibilities from the Ministry of Telecommunications to the TRA in accordance with the applicable regulatory decisions.\u003c/p>\u003cp>Important Regulatory Note\u003c/p>\u003cp>The September 2, 2026 notification has been reported by specialist regulatory compliance sources as clarifying the use of manufacturer-based Type Approval for identical products.\u003c/p>\u003cp>However, manufacturers and importers should verify the applicable procedure directly with the TRA before relying on the clarification for a specific shipment, as the TRA’s currently published FAQ pages contain additional provisions concerning importer-specific Type Approval certificates and importation procedures.\u003c/p>\u003cp>Companies should therefore confirm the applicable certificate structure and documentation requirements with the TRA for each product and import scenario.\u003c/p>\u003cp>What This Means for Manufacturers\u003c/p>\u003cp>International manufacturers planning to enter the Lebanese market should review their Type Approval strategy before shipping products.\u003c/p>\u003cp>Particular attention should be given to:\u003c/p>\u003cp>Manufacturer and authorized representative information\u003c/p>\u003cp>Exact product and model identification\u003c/p>\u003cp>Technical specifications\u003c/p>\u003cp>Radio and telecommunications functions\u003c/p>\u003cp>Test reports\u003c/p>\u003cp>Declaration of Conformity\u003c/p>\u003cp>Technical Compliance Folder\u003c/p>\u003cp>Applicable Type Approval classification\u003c/p>\u003cp>Importation and customs requirements\u003c/p>\u003cp>TRA labeling requirements\u003c/p>\u003cp>AFAQ JOOD Regulatory Support\u003c/p>\u003cp>AFAQ JOOD supports manufacturers, OEMs, ODMs, exporters, distributors, and technology companies with Type Approval and regulatory coordination across Middle East and African markets.\u003c/p>\u003cp>Our team can assist with regulatory assessment, technical documentation, manufacturer authorization, application preparation, Type Approval coordination, and regulatory follow-up for telecommunications, RF, wireless, IoT, and other regulated technology products entering the Lebanese market.\u003cbr>\u003c/p>"},"whatKnow":{"en":"\u003cp>The Lebanese Telecommunications Regulatory Authority (TRA) issued Notification No. TRA/PRE/327-020926 on September 2, 2026, clarifying the Type Approval procedure for equipment with telecommunications capabilities.\u003c/p>\u003cp>According to the notification as reported by specialist regulatory compliance sources, the Type Approval application may be submitted in the name of the manufacturer, either directly by the manufacturer or through an authorized representative.\u003c/p>\u003cp>The resulting Type Approval Certificate is issued in the manufacturer’s name for the specific approved model or product. The notification states that importers bringing the identical approved product into Lebanon may rely on the manufacturer-based Type Approval, provided that the imported equipment corresponds to the approved model and technical specifications.\u003c/p>\u003cp>Manufacturers should therefore ensure that the model number, product specifications, telecommunications functions, and technical documentation submitted for Type Approval accurately correspond to the products intended for the Lebanese market.\u003c/p>"},"sourceName":"Telecommunications Regulatory Authority of Lebanon (TRA) – Notification TRA/PRE/327-020926","sourceUrl":"https://www.tra.gov.lb/Type-approval-Regulation?","sourceType":"Official Regulatory Authority","image":"/assets/news/lb/lebanon-tra-clarifies-manufacturer-based-type-approval-certificates.jpg"};</script></body></html>
