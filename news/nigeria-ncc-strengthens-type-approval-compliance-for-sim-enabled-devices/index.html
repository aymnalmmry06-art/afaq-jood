<script>window.__AFAQ_STATIC_ARTICLE={"id":"news-1789567311593","slug":"nigeria-ncc-strengthens-type-approval-compliance-for-sim-enabled-devices","status":"published","country":"Nigeria","countryCode":"NG","countryKey":"NG__nigeria__30","countrySlug":"nigeria","countryName":{"en":"Nigeria"},"authority":"NCC","category":"Regulatory Update","date":"2026-09-16","publishedAt":"2026-09-16T14:09:55.511Z","updatedAt":"2026-09-16T14:09:55.511Z","author":"AFAQ JOOD Regulatory Intelligence Team","impact":"high","featured":false,"products":["Mobile phones SIM-enabled devices Cellular communication equipment IoT devices with cellular connectivity Wireless communication devices Telecommunications terminals Connected devices Devices containing IMEI identifiers Other communication equipment subject to NCC Type Approval"],"tags":["Nigeria Type Approval","Nigeria NCC","NCC Type Approval","Nigeria telecom regulations","Nigeria RF approval","Nigeria wireless approval","Nigeria mobile device approval","Nigeria IoT approval","SIM-enabled devices Nigeria","NCC DMS","Device Management System Nigeria","CEIR Nigeria","IMEI Nigeria","Nigeria regulatory compliance","Nigeria market access"],"title":{"en":"Nigeria NCC Strengthens Type Approval Compliance for SIM-Enabled Devices"},"summary":{"en":"Nigeria’s Communications Commission (NCC) is strengthening Type Approval compliance for SIM-enabled communication devices through a technology-based compliance framework supported by a Device Management System (DMS)."},"body":{"en":"\u003cp>Nigeria NCC Strengthens Type Approval Compliance for SIM-Enabled Devices\u003c/p>\u003cp>Nigeria’s Communications Commission (NCC) is strengthening Type Approval compliance for communication devices through a technology-based regulatory framework designed to improve the identification and verification of compliant equipment.\u003c/p>\u003cp>The initiative focuses particularly on communication devices equipped with SIM functionality and introduces a Device Management System (DMS) as a technological platform supporting automated Type Approval compliance monitoring.\u003c/p>\u003cp>According to the NCC, the framework is intended to make Type Approval compliance more efficient and consistent while strengthening oversight of communication devices entering, being sold, and operating in Nigeria.\u003c/p>\u003cp>Type Approval Requirement\u003c/p>\u003cp>Under Section 132(2) of the Nigerian Communications Act 2003, communication equipment covered by the applicable requirements must obtain Type Approval from the NCC before being sold or used in Nigeria.\u003c/p>\u003cp>The new compliance framework strengthens the Commission’s ability to verify whether devices entering the Nigerian market have satisfied the applicable Type Approval requirements.\u003c/p>\u003cp>Device Management System\u003c/p>\u003cp>The Device Management System (DMS) will support the automated verification of communication devices and their Type Approval status.\u003c/p>\u003cp>The NCC has stated that the implementation is being carried out in cooperation with key stakeholders, including the Nigeria Customs Service, Original Equipment Manufacturers (OEMs), importers, and relevant market associations.\u003c/p>\u003cp>The initial implementation focuses on incorporating devices already in the market and ensuring that future imported devices are appropriately registered and authenticated.\u003c/p>\u003cp>Central Equipment Identity Register\u003c/p>\u003cp>The NCC has linked the implementation of the new compliance framework to the Central Equipment Identity Register (CEIR), established under the Type Approval Business Rules issued in August 2024.\u003c/p>\u003cp>The CEIR maintains records associated with communication devices operating in Nigeria, including International Mobile Equipment Identity (IMEI) information for applicable devices.\u003c/p>\u003cp>According to the NCC, the centralized system is intended to strengthen the Commission’s ability to identify devices that do not comply with applicable regulatory requirements.\u003c/p>\u003cp>Impact on SIM-Enabled Devices\u003c/p>\u003cp>The NCC has stated that SIM-enabled communication devices entering Nigeria will be subject to the applicable registration and authentication requirements.\u003c/p>\u003cp>Devices that have not been properly registered and authenticated may be prevented from operating on Nigerian mobile networks under the applicable framework.\u003c/p>\u003cp>The system is also intended to help identify illegally imported or non-compliant devices and support the identification of devices reported as stolen.\u003c/p>\u003cp>Affected Products\u003c/p>\u003cp>The development is particularly relevant to:\u003c/p>\u003cp>Mobile phones\u003c/p>\u003cp>SIM-enabled communication devices\u003c/p>\u003cp>Cellular equipment\u003c/p>\u003cp>IoT devices with cellular connectivity\u003c/p>\u003cp>Wireless communication equipment\u003c/p>\u003cp>Telecommunications terminal equipment\u003c/p>\u003cp>Connected devices containing IMEI identifiers\u003c/p>\u003cp>Other communication equipment subject to NCC Type Approval requirements\u003c/p>\u003cp>What Manufacturers and Importers Need to Know\u003c/p>\u003cp>Manufacturers, OEMs, exporters, and importers supplying communication equipment to Nigeria should ensure that applicable Type Approval requirements are completed before products are introduced into the Nigerian market.\u003c/p>\u003cp>Companies should maintain consistency between the products submitted for Type Approval and the equipment subsequently imported and distributed in Nigeria.\u003c/p>\u003cp>Particular attention should be given to:\u003c/p>\u003cp>Product model identification\u003c/p>\u003cp>IMEI and device identity information where applicable\u003c/p>\u003cp>Technical specifications\u003c/p>\u003cp>Test reports\u003c/p>\u003cp>Declaration of Conformity\u003c/p>\u003cp>Technical construction documentation\u003c/p>\u003cp>Product and equipment labeling\u003c/p>\u003cp>Type Approval certification\u003c/p>\u003cp>Applicable registration and authentication requirements\u003c/p>\u003cp>Manufacturers should also monitor the implementation of the DMS and CEIR framework as the NCC continues to strengthen automated compliance verification.\u003c/p>\u003cp>Regulatory Framework\u003c/p>\u003cp>The NCC currently publishes the Type Approval Regulations 2024 and Type Approval Business Rules 2024 as part of its regulatory framework for telecommunications equipment.\u003c/p>\u003cp>The Commission maintains a list of approved telecommunications equipment and continues to update its regulatory and Type Approval resources.\u003c/p>\u003cp>AFAQ JOOD Regulatory Support\u003c/p>\u003cp>AFAQ JOOD supports manufacturers, OEMs, ODMs, exporters, distributors, and technology companies with Type Approval and regulatory coordination across Middle East and African markets.\u003c/p>\u003cp>Our team can assist with regulatory assessment, technical documentation, manufacturer authorization, application preparation, Type Approval coordination, and regulatory follow-up for telecommunications, RF, wireless, IoT, cellular, and other regulated technology products entering the Nigerian market.\u003cbr>\u003c/p>"},"whatKnow":{"en":"\u003cp>The Nigerian Communications Commission (NCC) is strengthening enforcement of Type Approval requirements for communication devices imported, sold, and used in Nigeria.\u003c/p>\u003cp>The new technology-based compliance framework is supported by a Device Management System (DMS), which enables the NCC to electronically verify Type Approval compliance for SIM-enabled devices.\u003c/p>\u003cp>The initiative is being implemented in cooperation with key stakeholders, including the Nigeria Customs Service, original equipment manufacturers (OEMs), importers, and relevant market associations.\u003c/p>\u003cp>Manufacturers and importers should ensure that communication devices entering the Nigerian market have the required Type Approval and are properly registered within the applicable regulatory framework.\u003c/p>"},"sourceName":"Nigerian Communications Commission (NCC)","sourceUrl":"https://ncc.gov.ng/media-centre/press-releases/ncc-strengthens-type-approval-compliance-sim-enabled-devices-nigeria?","sourceType":"Official Regulatory Authority","image":"/assets/news/ng/nigeria-ncc-strengthens-type-approval-compliance-for-sim-enabled-devices.jpg"};</script></body></html>
