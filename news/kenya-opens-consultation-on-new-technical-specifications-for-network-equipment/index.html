<script>window.__AFAQ_STATIC_ARTICLE={"id":"news-1789567550381","slug":"kenya-opens-consultation-on-new-technical-specifications-for-network-equipment","status":"published","country":"Kenya","countryCode":"KE","countryKey":"KE__kenya__26","countrySlug":"kenya","countryName":{"en":"Kenya"},"authority":"Communications Authority of Kenya","category":"Regulatory Update","date":"2026-09-16","publishedAt":"2026-09-16T14:09:55.511Z","updatedAt":"2026-09-16T14:09:55.511Z","author":"AFAQ JOOD Regulatory Intelligence Team","impact":"high","featured":false,"products":["Routers Switches Network equipment Enterprise networking equipment Wireless networking equipment Telecommunications equipment Data communication equipment Network infrastructure equipment RF and wireless network devices Other equipment subject to Kenya Type Approval"],"tags":["Kenya Type Approval","Kenya Communications Authority","Kenya CA","Kenya network equipment","Kenya Type Approval requirements","Kenya telecom regulations","Kenya RF approval","Kenya wireless approval","Kenya routers approval","Kenya networking equipment approval","Kenya ICT compliance","Kenya market access","Communications Authority Kenya","Type Approval 2026"],"title":{"en":"Kenya Opens Consultation on New Technical Specifications for Network Equipment"},"summary":{"en":"Kenya’s Communications Authority has opened a public consultation on proposed Technical Specifications for Network Equipment, 2026, which will guide the Type Approval of network equipment sold and used in Kenya."},"body":{"en":"\u003cp>Kenya Opens Consultation on New Technical Specifications for Network Equipment\u003c/p>\u003cp>Kenya’s Communications Authority (CA) has opened a public consultation on proposed Technical Specifications for Network Equipment, 2026.\u003c/p>\u003cp>The proposed specifications are intended to guide the Type Approval process for network equipment sold and used in Kenya. The Authority has invited members of the public and stakeholders in the ICT sector to review the proposed requirements and submit their representations by September 30, 2026.\u003c/p>\u003cp>The consultation represents an important regulatory development for manufacturers, vendors, importers, distributors, and technology companies supplying network infrastructure and communications equipment to the Kenyan market.\u003c/p>\u003cp>What Manufacturers Need to Know\u003c/p>\u003cp>The Communications Authority is responsible for the Type Approval and acceptance of telecommunications and radio communication equipment intended for use in Kenya.\u003c/p>\u003cp>Under the proposed 2026 specifications, network equipment will be assessed against the applicable technical requirements before being introduced into the Kenyan market.\u003c/p>\u003cp>Manufacturers and suppliers should review the proposed specifications and evaluate whether their products and existing technical documentation remain aligned with the requirements that may apply following the regulatory process.\u003c/p>\u003cp>Affected Products\u003c/p>\u003cp>The proposed framework is particularly relevant to:\u003c/p>\u003cp>Routers\u003c/p>\u003cp>Network switches\u003c/p>\u003cp>Enterprise networking equipment\u003c/p>\u003cp>Wireless networking equipment\u003c/p>\u003cp>Data communication equipment\u003c/p>\u003cp>Telecommunications network equipment\u003c/p>\u003cp>Network infrastructure equipment\u003c/p>\u003cp>RF and wireless network devices\u003c/p>\u003cp>Other communications equipment subject to Kenya Type Approval requirements\u003c/p>\u003cp>Type Approval in Kenya\u003c/p>\u003cp>The Communications Authority requires communications equipment intended to operate within public telecommunications networks in Kenya to undergo Type Approval or Type Acceptance, as applicable.\u003c/p>\u003cp>The Authority's Type Approval framework covers a wide range of equipment, including mobile cellular devices, radio communication equipment, routers, modems, switches, satellite equipment, and other telecommunications products.\u003c/p>\u003cp>Type Approval is generally carried out for each equipment model, while changes to the model, design, or specifications may require the equipment to be submitted again for approval.\u003c/p>\u003cp>Technical Compliance\u003c/p>\u003cp>The CA evaluates Type Approval applications using technical documentation and conformity evidence.\u003c/p>\u003cp>Depending on the equipment category, manufacturers and applicants may be required to provide technical manuals, user manuals, conformity certificates, and applicable RF, EMC, and safety test reports.\u003c/p>\u003cp>Manufacturers should ensure that the documentation submitted for Type Approval accurately represents the commercial version of the equipment intended for the Kenyan market.\u003c/p>\u003cp>Public Consultation\u003c/p>\u003cp>The Communications Authority has invited ICT industry stakeholders and members of the public to provide comments on the proposed Technical Specifications for Network Equipment, 2026.\u003c/p>\u003cp>Submissions are being accepted until September 30, 2026.\u003c/p>\u003cp>The consultation is intended to provide stakeholders with an opportunity to review the proposed technical framework and provide feedback before the regulatory requirements are finalized.\u003c/p>\u003cp>What This Means for Manufacturers\u003c/p>\u003cp>Companies planning to introduce network equipment into Kenya should monitor the outcome of the consultation and review the proposed technical specifications.\u003c/p>\u003cp>Manufacturers should pay particular attention to:\u003c/p>\u003cp>Product model identification\u003c/p>\u003cp>Technical specifications\u003c/p>\u003cp>RF characteristics where applicable\u003c/p>\u003cp>EMC compliance\u003c/p>\u003cp>Safety requirements\u003c/p>\u003cp>Network interoperability\u003c/p>\u003cp>Technical manuals\u003c/p>\u003cp>Test reports\u003c/p>\u003cp>Declarations and conformity documentation\u003c/p>\u003cp>Type Approval documentation\u003c/p>\u003cp>Manufacturers with products already being prepared for the Kenyan market should also monitor any changes resulting from the consultation before finalizing future compliance submissions.\u003c/p>\u003cp>AFAQ JOOD Regulatory Support\u003c/p>\u003cp>AFAQ JOOD supports manufacturers, OEMs, ODMs, exporters, distributors, and technology companies with Type Approval and regulatory coordination across Middle East and African markets.\u003c/p>\u003cp>Our team can assist with regulatory assessment, technical documentation, manufacturer authorization, application preparation, Type Approval coordination, and regulatory follow-up for telecommunications, RF, wireless, IoT, networking, and other regulated technology products entering the Kenyan market.\u003cbr>\u003c/p>"},"whatKnow":{"en":"\u003cp>Kenya’s Communications Authority (CA) has developed proposed Technical Specifications for Network Equipment, 2026, to guide the Type Approval process for network equipment sold and used in Kenya.\u003c/p>\u003cp>The Authority has invited members of the public and ICT sector stakeholders to submit comments on the proposed specifications by September 30, 2026.\u003c/p>\u003cp>Manufacturers, vendors, importers, distributors, and other stakeholders supplying network equipment to Kenya should review the proposed technical requirements and assess their potential impact on existing and future Type Approval applications.\u003c/p>"},"sourceName":"Communications Authority of Kenya (CA)","sourceUrl":"https://www.ca.go.ke/open-consultations?","sourceType":"Official Regulatory Authority","image":"/assets/news/ke/kenya-opens-consultation-on-new-technical-specifications-for-network-equipment.jpg"};</script></body></html>
