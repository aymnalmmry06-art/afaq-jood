[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/news/*"
  to = "/news-article.html?slug=:splat"
  status = 200

[[redirects]]
  from = "/news-sitemap.xml"
  to = "/.netlify/functions/news-sitemap"
  status = 200

[[redirects]]
  from = "/api/news-admin"
  to = "/.netlify/functions/news-admin"
  status = 200
